<section class="page-head">
  <h1>Book an appointment</h1>
  <p class="page-sub" id="booking-shop-label">Choose a shop to start.</p>
</section>

<section class="booking-wrap">
  <div class="booking-steps" role="tablist" aria-label="Booking steps">
    <div class="step active" data-step-tab="1" role="tab" aria-selected="true">
      <span class="step-num">1</span> Service
    </div>
    <div class="step" data-step-tab="2" role="tab" aria-selected="false" aria-disabled="true">
      <span class="step-num">2</span> Date
    </div>
    <div class="step" data-step-tab="3" role="tab" aria-selected="false" aria-disabled="true">
      <span class="step-num">3</span> Period
    </div>
    <div class="step" data-step-tab="4" role="tab" aria-selected="false" aria-disabled="true">
      <span class="step-num">4</span> Details
    </div>
  </div>

  <div class="booking-stage" id="booking-stage" aria-live="polite"></div>

  <div class="booking-summary" id="booking-summary" aria-live="polite"></div>
</section>
