<section style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 70vh; padding: 20px;">
  <div class="login-brand" aria-hidden="true">O</div>
  <h1 style="font-size: 1.6rem; margin:16px 0 8px; text-align:center;">Welcome back</h1>
  <p style="color:var(--text-muted); text-align:center; margin:0 0 28px; font-size:0.95rem;">Enter your details to manage your bookings.</p>

  <form id="login-form" novalidate style="width: 100%; max-width: 400px;">
    <div class="field" style="margin-bottom: 16px;">
      <label for="login-identifier" style="font-size:0.85rem; font-weight:600; margin-bottom:6px; display:block; color:var(--text-muted);">Email or Phone</label>
      <input
        id="login-identifier"
        name="identifier"
        type="text"
        inputmode="email"
        autocomplete="username"
        placeholder="you@example.com or +91 98765 43210"
        aria-describedby="login-identifier-hint"
        required
        style="width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text); font-size:1rem; outline:none;"
      />
      <p class="field-hint" id="login-identifier-hint" style="font-size:0.75rem; color:var(--text-muted); margin-top:6px;">
        Valid email or 10-digit phone number.
      </p>
    </div>

    <div class="field" style="margin-bottom: 24px;">
      <label for="login-name" style="font-size:0.85rem; font-weight:600; margin-bottom:6px; display:block; color:var(--text-muted);">Full Name</label>
      <input
        id="login-name"
        name="name"
        type="text"
        autocomplete="name"
        placeholder="e.g. Priya Sharma"
        required
        style="width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--glass-border); background:var(--glass-bg); color:var(--text); font-size:1rem; outline:none;"
      />
    </div>

    <p class="login-note" id="login-note" role="alert" style="color:var(--danger); font-size:0.85rem; margin-bottom:16px; text-align:center;"></p>

    <button class="btn btn-primary ripple btn-block" id="login-submit" type="submit" style="padding: 16px; font-size:1.05rem; border-radius:12px;">
      Continue
    </button>
  </form>
</section>
