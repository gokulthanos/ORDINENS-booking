<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ordinens Tech — book a barber, choose your shop, service and preferred time. Coimbatore." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Ordinens Tech" />
    <meta property="og:description" content="Skip the wait. Book your barber and slot online." />
    <title>Ordinens Tech</title>
    <style>
      html,
      body {
        background: #ffffff;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #ffffff;
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <div id="splash" class="splash" role="status" aria-label="Loading Ordinens Tech">
      <div class="splash-stage">
        <div class="splash-id">
          <img id="splash-mark" class="splash-mark" alt="Ordinens Tech" width="1536" height="1024" />
          <div class="splash-word" id="splash-word">ORDINENS TECH</div>
        </div>
        <div class="splash-brand-block" id="splash-brand-block">
          <img id="splash-brand" class="splash-brand" alt="Ordinens Tech" width="1254" height="1254" />
          <div class="splash-powered" id="splash-powered">
            <span>Booking powered by</span>
            <strong>ORDINENS TECH</strong>
          </div>
          <div class="splash-progress" id="splash-progress" aria-hidden="true"><i></i></div>
          <div class="splash-preparing" id="splash-preparing">Preparing your experience…</div>
        </div>
      </div>
    </div>

    <header class="site-header" id="site-header">
      <div class="header-brand">
        <div class="brand-top">
          <span class="brand-mark">O</span>
          <span class="brand-name">ORDINENS TECH</span>
        </div>
        <div class="header-location">
          <svg class="location-pin" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="location-city" id="location-text">Coimbatore</span>
        </div>
      </div>
    </header>

    <nav class="bottom-nav" aria-label="Primary">
      <a href="#home" data-route="home">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="nav-label">Home</span>
      </a>
      <a href="#bookings" data-route="bookings">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span class="nav-label">Bookings</span>
      </a>
      <a href="#profile" data-route="profile">
        <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-label">Profile</span>
      </a>
    </nav>

    <main id="app" class="page" tabindex="-1"></main>

    <div class="loader" id="loader" aria-hidden="true" hidden>
      <div class="spinner"></div>
    </div>

    <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
