<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ordinens Tech — Shop Owner Management Panel. Manage bookings, services, barbers and shop settings." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:title" content="Ordinens Tech — Owner App" />
    <meta property="og:description" content="Manage your shop, bookings and team." />
    <title>Ordinens Tech — Owner App</title>
  </head>
  <body>
    <!-- Background -->
    <div id="ow-bg" aria-hidden="true"></div>

    <!-- Page loader bar -->
    <div id="ow-loader" hidden aria-hidden="true"></div>

    <!-- App shell -->
    <div id="ow-shell">

      <!-- Sidebar (desktop) -->
      <aside id="ow-sidebar" hidden>
        <div class="ow-sidebar-brand">
          <div class="ow-sidebar-logo" aria-hidden="true">✂</div>
          <div class="ow-sidebar-brand-text">
            <strong>ORDINENS TECH</strong>
            <small>Owner Panel</small>
          </div>
        </div>

        <nav class="ow-sidebar-nav" aria-label="Owner navigation">
          <a href="#dashboard" data-ow-route="dashboard">
            <span class="nav-icon" aria-hidden="true">⚡</span>
            Dashboard
          </a>
          <a href="#bookings" data-ow-route="bookings">
            <span class="nav-icon" aria-hidden="true">📋</span>
            Bookings
          </a>
          <a href="#calendar" data-ow-route="calendar">
            <span class="nav-icon" aria-hidden="true">📅</span>
            Calendar
          </a>
          <a href="#services" data-ow-route="services">
            <span class="nav-icon" aria-hidden="true">✂</span>
            Services
          </a>
          <a href="#barbers" data-ow-route="barbers">
            <span class="nav-icon" aria-hidden="true">👨</span>
            Barbers
          </a>
          <a href="#shop" data-ow-route="shop">
            <span class="nav-icon" aria-hidden="true">🏪</span>
            Shop
          </a>
          <a href="#reviews" data-ow-route="reviews">
            <span class="nav-icon" aria-hidden="true">⭐</span>
            Reviews
          </a>
        </nav>

        <div class="ow-sidebar-footer">
          <a href="#settings" data-ow-route="settings">
            <span class="nav-icon" aria-hidden="true">⚙</span>
            Settings
          </a>
          <button id="sidebar-logout" type="button">
            <span class="nav-icon" aria-hidden="true">🚪</span>
            Sign Out
          </button>
        </div>
      </aside>

      <!-- Main content -->
      <div id="ow-main">
        <main id="app" class="page" tabindex="-1" aria-label="Main content"></main>
      </div>
    </div>

    <!-- Bottom Nav (mobile) -->
    <nav id="ow-bottom-nav" hidden aria-label="Owner mobile navigation">
      <a href="#dashboard" data-ow-route="dashboard" id="bn-dashboard">
        <span class="nav-icon" aria-hidden="true">⚡</span>
        <span>Home</span>
      </a>
      <a href="#bookings" data-ow-route="bookings" id="bn-bookings">
        <span class="nav-icon" aria-hidden="true">📋</span>
        <span>Bookings</span>
      </a>
      <a href="#calendar" data-ow-route="calendar" id="bn-calendar">
        <span class="nav-icon" aria-hidden="true">📅</span>
        <span>Calendar</span>
      </a>
      <a href="#services" data-ow-route="services" id="bn-services">
        <span class="nav-icon" aria-hidden="true">✂</span>
        <span>Services</span>
      </a>
      <button id="ow-more-btn" type="button" aria-expanded="false" aria-label="More options">
        <span class="nav-icon" aria-hidden="true">☰</span>
        <span>More</span>
      </button>
    </nav>

    <!-- More drawer (mobile) -->
    <div id="ow-more-drawer" role="dialog" aria-label="More navigation" aria-hidden="true">
      <div class="ow-drawer-grid">
        <a href="#barbers" data-ow-route="barbers" class="ow-drawer-item">
          <span class="nav-icon" aria-hidden="true">👨</span>
          Barbers
        </a>
        <a href="#shop" data-ow-route="shop" class="ow-drawer-item">
          <span class="nav-icon" aria-hidden="true">🏪</span>
          Shop
        </a>
        <a href="#reviews" data-ow-route="reviews" class="ow-drawer-item">
          <span class="nav-icon" aria-hidden="true">⭐</span>
          Reviews
        </a>
        <a href="#settings" data-ow-route="settings" class="ow-drawer-item">
          <span class="nav-icon" aria-hidden="true">⚙</span>
          Settings
        </a>
      </div>
    </div>

    <!-- Toast container -->
    <div id="ow-toast-wrap" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
